name: Copywriting
description: Text-only updates — microcopy edits, marketing copy, or localization strings.
title: "[Copywriting]: "
labels: ["Type: Copywriting"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for filing a copywriting request. Required fields are marked with an asterisk. The "Proposed" dropdowns capture your suggestion — the triager will confirm or adjust the actual labels during triage.

  - type: textarea
    id: copy-change
    attributes:
      label: Copy Change
      description: Where does the text appear, what does it say now, and what should it say? Paste current and proposed copy side by side.
      placeholder: |
        Location: checkout → empty cart state
        Current: "Your cart is empty."
        Proposed: "Nothing here yet — let's fix that. Browse the new arrivals →"
    validations:
      required: true

  - type: textarea
    id: localization
    attributes:
      label: Localization & Notes
      description: Does this need translating? Any character limits, tone, or brand guidelines to follow?
      placeholder: |
        - Needs EN, FR, DE
        - Max 60 characters for the button label

  - type: dropdown
    id: proposed-owner
    attributes:
      label: Proposed Owner
      description: Which stakeholder / business driver does this serve?
      options:
        - Product
        - Marketing
        - Sales
        - Support
        - Engineering
        - Reliability
        - Security
        - Compliance
    validations:
      required: true

  - type: dropdown
    id: proposed-priority
    attributes:
      label: Proposed Priority
      description: |
        The Owner ultimately sets Priority — this is your suggestion.
        • 0 Critical — production broken or launch blocked
        • 1 High — must land this sprint or next
        • 2 Normal — standard backlog pull
        • 3 Low — opportunistic or nice-to-have
      default: 2
      options:
        - "0 Critical"
        - "1 High"
        - "2 Normal"
        - "3 Low"
    validations:
      required: true

  - type: dropdown
    id: proposed-area
    attributes:
      label: Proposed Area
      description: Which part of the app or which discipline picks this up? If it spans two, pick the dominant one.
      options:
        - Front-end
        - Back-end
        - Data
        - DevOps
        - Mobile
        - Design
        - QA
        - CMS
        - Commerce
        - Marketing Site
        - Authentication
        - User Tools
        - Notifications
        - Search
        - Reporting
        - Integrations
        - Analytics
        - Admin Tools
    validations:
      required: true

  - type: textarea
    id: external-links
    attributes:
      label: External Links
      description: Style guide, related issues, Slack threads, the page or screen in question.
      placeholder: |
        - Style guide:
        - Slack:
        - Related issue: #

  - type: textarea
    id: sub-tasks
    attributes:
      label: Sub-Tasks
      description: Break the work into a checklist of smaller steps. Sub-Tasks are the one place for to-do checkboxes.
      placeholder: |
        - [ ] First step
        - [ ] Second step
