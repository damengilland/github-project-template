name: Design
description: Mockups, wireframes, high-fidelity comps, prototypes, design-system additions, or marketing creative. Designer-led.
title: "[Design]: "
labels: ["Type: Design"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for filing a design request. Required fields are marked with an asterisk. The "Proposed" dropdowns capture your suggestion — the triager will confirm or adjust the actual labels during triage.

  - type: textarea
    id: whats-needed
    attributes:
      label: What Needs To Be Designed
      description: The problem to solve or the asset to produce. Include the audience, the surface (screen, email, landing page), and any constraints.
      placeholder: |
        New empty-state for the wishlist page — illustration plus a one-line prompt to start browsing. Needs mobile and desktop. Must use the existing design-system color tokens.
    validations:
      required: true

  - type: textarea
    id: deliverables
    attributes:
      label: Deliverables & Fidelity
      description: What format and fidelity do you need back? Wireframe, high-fi comp, clickable prototype, exported assets, or a design-system component?
      value: |
        - High-fidelity comps (mobile + desktop)
        - Exported assets
        - Prototype link

  - type: dropdown
    id: proposed-owner
    attributes:
      label: Proposed Owner
      description: Which stakeholder / business driver does this serve?
      options:
        - Product
        - Marketing
        - Sales
        - Support
        - Engineering
        - Reliability
        - Security
        - Compliance
    validations:
      required: true

  - type: dropdown
    id: proposed-priority
    attributes:
      label: Proposed Priority
      description: |
        The Owner ultimately sets Priority — this is your suggestion.
        • 0 Critical — production broken or launch blocked
        • 1 High — must land this sprint or next
        • 2 Normal — standard backlog pull
        • 3 Low — opportunistic or nice-to-have
      default: 2
      options:
        - "0 Critical"
        - "1 High"
        - "2 Normal"
        - "3 Low"
    validations:
      required: true

  - type: dropdown
    id: proposed-area
    attributes:
      label: Proposed Area
      description: Which part of the app or which discipline picks this up? Most design tickets sit under Design — change it if the work clearly belongs to another area.
      default: 5
      options:
        - Front-end
        - Back-end
        - Data
        - DevOps
        - Mobile
        - Design
        - QA
        - CMS
        - Commerce
        - Marketing Site
        - Authentication
        - User Tools
        - Notifications
        - Search
        - Reporting
        - Integrations
        - Analytics
        - Admin Tools
    validations:
      required: true

  - type: textarea
    id: external-links
    attributes:
      label: External Links
      description: Figma files, brand guidelines, related issues, inspiration, reference material.
      placeholder: |
        - Figma:
        - Brand guidelines:
        - Related issue: #

  - type: textarea
    id: sub-tasks
    attributes:
      label: Sub-Tasks
      description: Break the work into a checklist of smaller steps. Sub-Tasks are the one place for to-do checkboxes.
      placeholder: |
        - [ ] First step
        - [ ] Second step
