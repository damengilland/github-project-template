name: Documentation
description: READMEs, API docs, internal wikis, or runbooks.
title: "[Documentation]: "
labels: ["Type: Documentation", "Needs Triage"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for filing a documentation request. Required fields are marked with an asterisk. The "Proposed" dropdowns capture your suggestion — the triager will confirm or adjust the actual labels during triage.

  - type: textarea
    id: whats-needed
    attributes:
      label: What Needs Documenting
      description: The topic, the audience, and where the docs should live. Note whether you're creating new docs or fixing existing ones.
      placeholder: |
        Write a runbook for rotating the Stripe webhook signing secret — audience is on-call engineers. Lives in the internal ops wiki under Payments.
    validations:
      required: true

  - type: textarea
    id: acceptance-criteria
    attributes:
      label: Acceptance Criteria
      description: How will we know the docs are done and correct?
      value: |
        - [ ] Covers the steps end to end
        - [ ] Reviewed by someone who didn't write it
        - [ ]

  - type: dropdown
    id: proposed-owner
    attributes:
      label: Proposed Owner
      description: Which stakeholder / business driver does this serve?
      options:
        - Product
        - Marketing
        - Sales
        - Support
        - Engineering
        - Reliability
        - Security
        - Compliance
    validations:
      required: true

  - type: dropdown
    id: proposed-priority
    attributes:
      label: Proposed Priority
      description: |
        The Owner ultimately sets Priority — this is your suggestion.
        • 0 Critical — production broken or launch blocked
        • 1 High — must land this sprint or next
        • 2 Normal — standard backlog pull
        • 3 Low — opportunistic or nice-to-have
      default: 2
      options:
        - "0 Critical"
        - "1 High"
        - "2 Normal"
        - "3 Low"
    validations:
      required: true

  - type: dropdown
    id: proposed-area
    attributes:
      label: Proposed Area
      description: Which part of the app or which discipline do these docs concern? If it spans two, pick the dominant one.
      options:
        - Front-end
        - Back-end
        - Data
        - DevOps
        - Mobile
        - Design
        - QA
        - CMS
        - Commerce
        - Marketing Site
        - Authentication
        - User Tools
        - Notifications
        - Search
        - Reporting
        - Integrations
        - Analytics
        - Admin Tools
    validations:
      required: true

  - type: textarea
    id: external-links
    attributes:
      label: External Links
      description: Existing docs, the code being documented, Slack threads, related issues.
      placeholder: |
        - Existing doc:
        - Slack:
        - Related issue: #
