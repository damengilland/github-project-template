name: Enhancement
description: An improvement to an existing feature.
title: "[Enhancement]: "
labels: ["Type: Enhancement", "Needs Triage"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for filing an enhancement. Required fields are marked with an asterisk. The "Proposed" dropdowns capture your suggestion — the triager will confirm or adjust the actual labels during triage.

  - type: textarea
    id: current-vs-desired
    attributes:
      label: Current vs. Desired Behavior
      description: What does the feature do today, and what should it do instead? Link the existing feature or issue if there is one.
      placeholder: |
        Today the wishlist holds up to 25 items and silently drops the oldest when you add more. Instead it should hold unlimited items and paginate at 25 per page.
    validations:
      required: true

  - type: textarea
    id: acceptance-criteria
    attributes:
      label: Acceptance Criteria
      description: Specific, testable conditions for "done". Use task list syntax so devs can check items off as they go.
      value: |
        - [ ]
        - [ ]
    validations:
      required: true

  - type: dropdown
    id: proposed-owner
    attributes:
      label: Proposed Owner
      description: Which stakeholder / business driver does this serve?
      options:
        - Product
        - Marketing
        - Sales
        - Support
        - Engineering
        - Reliability
        - Security
        - Compliance
    validations:
      required: true

  - type: dropdown
    id: proposed-priority
    attributes:
      label: Proposed Priority
      description: |
        The Owner ultimately sets Priority — this is your suggestion.
        • 0 Critical — production broken or launch blocked
        • 1 High — must land this sprint or next
        • 2 Normal — standard backlog pull
        • 3 Low — opportunistic or nice-to-have
      default: 2
      options:
        - "0 Critical"
        - "1 High"
        - "2 Normal"
        - "3 Low"
    validations:
      required: true

  - type: dropdown
    id: proposed-area
    attributes:
      label: Proposed Area
      description: Which part of the app or which discipline picks this up? If it spans two, pick the dominant one and note the others below.
      options:
        - Front-end
        - Back-end
        - Data
        - DevOps
        - Mobile
        - Design
        - QA
        - CMS
        - Commerce
        - Marketing Site
        - Authentication
        - User Tools
        - Notifications
        - Search
        - Reporting
        - Integrations
        - Analytics
        - Admin Tools
    validations:
      required: true

  - type: textarea
    id: external-links
    attributes:
      label: External Links
      description: Slack threads, docs, Figma files, related issues, reference material.
      placeholder: |
        - Doc:
        - Slack:
        - Related issue: #
