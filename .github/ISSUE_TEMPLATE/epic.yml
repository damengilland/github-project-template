name: Epic
description: A parent ticket that groups related issues under one body of work.
title: "[Epic]: "
labels: ["Epic"]
body:
  - type: markdown
    attributes:
      value: |
        An epic is a lightweight hub for a larger body of work. File the individual pieces with the other templates and link them in the checklist below.

  - type: textarea
    id: overview
    attributes:
      label: Overview
      description: What is this epic about? A sentence or two is fine.
    validations:
      required: true

  - type: textarea
    id: child-issues
    attributes:
      label: Child Issues
      description: Link the sub-issues. Use `- [ ] #NNN` so GitHub renders a task list that auto-checks as they close.
      placeholder: |
        - [ ] #
        - [ ] #
