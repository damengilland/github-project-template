name: Question
description: Needs stakeholder clarification before work can begin.
title: "[Question]: "
labels: ["Type: Question"]
body:
  - type: markdown
    attributes:
      value: |
        Use this template when work is blocked on a decision or clarification. Required fields are marked with an asterisk. The "Proposed" dropdowns capture your suggestion — the triager will confirm or adjust the actual labels during triage.

  - type: textarea
    id: the-question
    attributes:
      label: The Question
      description: What needs clarifying? Be specific about the decision you're waiting on.
      placeholder: |
        Should guest checkout create a shadow account, or stay fully anonymous until the user opts in? This affects how we model orders.
    validations:
      required: true

  - type: textarea
    id: whats-blocked
    attributes:
      label: What's Blocked On The Answer
      description: What work can't start (or can't finish) until this is resolved? Link the affected issues.
      placeholder: |
        - Blocks #142 (guest checkout build)
        - The orders data model depends on the answer

  - type: input
    id: who-can-answer
    attributes:
      label: Who Can Answer
      description: The person or team who owns this decision, if known.
      placeholder: "@product-lead / Legal"

  - type: dropdown
    id: proposed-owner
    attributes:
      label: Proposed Owner
      description: Which stakeholder / business driver does this serve?
      options:
        - Product
        - Marketing
        - Sales
        - Support
        - Engineering
        - Reliability
        - Security
        - Compliance
    validations:
      required: true

  - type: dropdown
    id: proposed-priority
    attributes:
      label: Proposed Priority
      description: |
        The Owner ultimately sets Priority — this is your suggestion.
        • 0 Critical — production broken or launch blocked
        • 1 High — must land this sprint or next
        • 2 Normal — standard backlog pull
        • 3 Low — opportunistic or nice-to-have
      default: 2
      options:
        - "0 Critical"
        - "1 High"
        - "2 Normal"
        - "3 Low"
    validations:
      required: true

  - type: dropdown
    id: proposed-area
    attributes:
      label: Proposed Area
      description: Which part of the app or which discipline does this question concern? If it spans two, pick the dominant one.
      options:
        - Front-end
        - Back-end
        - Data
        - DevOps
        - Mobile
        - Design
        - QA
        - CMS
        - Commerce
        - Marketing Site
        - Authentication
        - User Tools
        - Notifications
        - Search
        - Reporting
        - Integrations
        - Analytics
        - Admin Tools
    validations:
      required: true

  - type: textarea
    id: external-links
    attributes:
      label: External Links
      description: Slack threads, docs, related issues, anything that frames the question.
      placeholder: |
        - Doc:
        - Slack:
        - Related issue: #
