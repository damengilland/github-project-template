name: Refactor
description: Internal cleanup with no behavior change.
title: "[Refactor]: "
labels: ["Type: Refactor"]
projects: ["damengilland/1"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for filing a refactor. Required fields are marked with an asterisk. The "Proposed" dropdowns capture your suggestion — the triager will confirm or adjust the actual labels during triage.

  - type: textarea
    id: whats-the-cleanup
    attributes:
      label: What Needs Cleanup & Why
      description: Describe the code to be refactored and the payoff — readability, performance, testability, reduced duplication. This is internal-only; there must be no change in observable behavior.
      placeholder: |
        The checkout total is recalculated in three places with slightly different rounding. Extract a single `calculateOrderTotal()` helper and call it everywhere. No change to the numbers users see.
    validations:
      required: true

  - type: textarea
    id: acceptance-criteria
    attributes:
      label: Acceptance Criteria
      description: How will we know the cleanup is safe and complete?
      value: |
        - No change in observable behavior
        - Existing tests still pass (add characterization tests if coverage is thin)
        -
    validations:
      required: true

  - type: dropdown
    id: proposed-owner
    attributes:
      label: Proposed Owner
      description: Which stakeholder / business driver does this serve?
      options:
        - Product
        - Marketing
        - Sales
        - Support
        - Engineering
        - Reliability
        - Security
        - Compliance
    validations:
      required: true

  - type: dropdown
    id: proposed-priority
    attributes:
      label: Proposed Priority
      description: |
        The Owner ultimately sets Priority — this is your suggestion.
        • 0 Critical — production broken or launch blocked
        • 1 High — must land this sprint or next
        • 2 Normal — standard backlog pull
        • 3 Low — opportunistic or nice-to-have
      default: 2
      options:
        - "0 Critical"
        - "1 High"
        - "2 Normal"
        - "3 Low"
    validations:
      required: true

  - type: dropdown
    id: proposed-area
    attributes:
      label: Proposed Area
      description: Which part of the app or which discipline picks this up? If it spans two, pick the dominant one and note the others below.
      options:
        - Front-end
        - Back-end
        - Data
        - DevOps
        - Mobile
        - Design
        - QA
        - CMS
        - Commerce
        - Marketing Site
        - Authentication
        - User Tools
        - Notifications
        - Search
        - Reporting
        - Integrations
        - Analytics
        - Admin Tools
    validations:
      required: true

  - type: textarea
    id: external-links
    attributes:
      label: External Links
      description: Slack threads, docs, related issues, reference material.
      placeholder: |
        - Doc:
        - Slack:
        - Related issue: #

  - type: textarea
    id: sub-tasks
    attributes:
      label: Sub-Tasks
      description: Break the work into a checklist of smaller steps. Sub-Tasks are the one place for to-do checkboxes.
      placeholder: |
        - [ ] First step
        - [ ] Second step
