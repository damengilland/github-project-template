name: Task
description: A general administrative or non-code to-do that doesn't fit the other types.
title: "[Task]: "
labels: ["Type: Task"]
body:
  - type: markdown
    attributes:
      value: |
        Use this template for lightweight, general to-dos that don't fit a more specific type. If your work matches a more specific type — a bug, a design, a doc, a research spike, a copy change, and so on — please back out and use that template instead, since it applies the right Type label automatically.

        Required fields are marked with an asterisk. The "Proposed" dropdowns capture your suggestion — the triager will confirm or adjust the actual labels during triage.

  - type: textarea
    id: description
    attributes:
      label: Description
      description: What needs to happen and why. Keep it brief — this template is for lightweight work.
      placeholder: |
        Archive the 2023 marketing landing pages and set up redirects to the current campaign hub.
    validations:
      required: true

  - type: dropdown
    id: proposed-owner
    attributes:
      label: Proposed Owner
      description: Which stakeholder / business driver does this serve?
      options:
        - Product
        - Marketing
        - Sales
        - Support
        - Engineering
        - Reliability
        - Security
        - Compliance
    validations:
      required: true

  - type: dropdown
    id: proposed-priority
    attributes:
      label: Proposed Priority
      description: |
        The Owner ultimately sets Priority — this is your suggestion.
        • 0 Critical — production broken or launch blocked
        • 1 High — must land this sprint or next
        • 2 Normal — standard backlog pull
        • 3 Low — opportunistic or nice-to-have
      default: 2
      options:
        - "0 Critical"
        - "1 High"
        - "2 Normal"
        - "3 Low"
    validations:
      required: true

  - type: dropdown
    id: proposed-area
    attributes:
      label: Proposed Area
      description: Which part of the app or which discipline picks this up?
      options:
        - Front-end
        - Back-end
        - Data
        - DevOps
        - Mobile
        - Design
        - QA
        - CMS
        - Commerce
        - Marketing Site
        - Authentication
        - User Tools
        - Notifications
        - Search
        - Reporting
        - Integrations
        - Analytics
        - Admin Tools
    validations:
      required: true

  - type: textarea
    id: external-links
    attributes:
      label: External Links
      description: Anything useful — Slack threads, docs, related issues, migration guides, Figma files.
      placeholder: |
        - Doc:
        - Slack:
        - Related issue: #

  - type: textarea
    id: sub-tasks
    attributes:
      label: Sub-Tasks
      description: Break the work into a checklist of smaller steps. Sub-Tasks are the one place for to-do checkboxes.
      placeholder: |
        - [ ] First step
        - [ ] Second step
