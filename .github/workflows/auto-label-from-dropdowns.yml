name: Auto-label from proposed dropdowns

# Runs once when an issue is opened. Reads the "Proposed Owner / Priority /
# Area" sections from the issue body and applies the matching labels. The
# Type label comes from the template's own front-matter; triage is tracked
# by the project board's Inbox column, not a label.

on:
  issues:
    types: [opened]

jobs:
  apply-labels:
    runs-on: ubuntu-latest
    permissions:
      issues: write
    steps:
      - name: Apply labels from issue body dropdowns
        uses: actions/github-script@v7
        with:
          script: |
            const body = context.payload.issue.body || '';

            // Dropdown heading → label prefix.
            // The dropdown values in the issue templates are kept as bare
            // suffixes (e.g. "Admin Tools", "0 Critical") precisely so that
            // this mapping is just "prefix + value".
            const mappings = [
              { heading: 'Proposed Owner',    prefix: 'Owner: '    },
              { heading: 'Proposed Priority', prefix: 'Priority: ' },
              { heading: 'Proposed Type',     prefix: 'Type: '     },
              { heading: 'Proposed Area',     prefix: 'Area: '     },
            ];

            const labelsToAdd = [];
            for (const { heading, prefix } of mappings) {
              const regex = new RegExp(`### ${heading}\\s*\\n+([^\\n]+)`);
              const match = body.match(regex);
              if (match) {
                const value = match[1].trim();
                if (value && value !== '_No response_') {
                  labelsToAdd.push(prefix + value);
                }
              }
            }

            if (labelsToAdd.length === 0) {
              console.log('No Proposed dropdown values found — nothing to apply.');
              return;
            }

            // Apply labels one at a time so a single missing label in the
            // repo doesn't block the others from being applied.
            const applied = [];
            const failed = [];
            for (const label of labelsToAdd) {
              try {
                await github.rest.issues.addLabels({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  issue_number: context.issue.number,
                  labels: [label],
                });
                applied.push(label);
              } catch (err) {
                failed.push({ label, message: err.message });
              }
            }

            console.log(`Applied: ${applied.join(', ') || '(none)'}`);
            if (failed.length > 0) {
              console.warn('Failed to apply:');
              for (const { label, message } of failed) {
                console.warn(`  - "${label}": ${message}`);
              }
              console.warn('Most common cause: the label does not exist in this repo yet.');
            }
